name: offline-check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tools/review_export.py
      - run: python tools/team.py test
      - run: python tools/team.py analyze
      - run: python tools/team.py report --out artifacts-local/report.html
